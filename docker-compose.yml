services:
  plex-qbt-manager:
    image: ghcr.io/monkeygonewild/plex-qbt-manager:latest
    container_name: plex-qbt-manager
    restart: unless-stopped
    ports:
      - "5252:5252"
    environment:
      PLEX_URL: ${PLEX_URL:-http://plex:32400}
      PLEX_TOKEN: ${PLEX_TOKEN}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-http://qbittorrent:8080}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      DEBOUNCE_SECONDS: ${DEBOUNCE_SECONDS:-3}
      STOP_DELAY_SECONDS: ${STOP_DELAY_SECONDS:-30}
      PAUSE_BUFFER_DELAY_SECONDS: ${PAUSE_BUFFER_DELAY_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_PORT: 5252
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck comes from the image. Add a network only if you address Plex
    # and qBittorrent by container name rather than IP:
    #   networks: [plex-network]
    # Add a volume only if you want the rotated file log on disk:
    #   volumes: ["/absolute/host/path/logs:/app/logs"]
