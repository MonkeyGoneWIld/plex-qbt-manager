services:
  plex-qbt-manager:
    image: ghcr.io/monkeygonewild/plex-qbt-manager:latest
    container_name: plex-qbt-manager
    restart: unless-stopped
    ports:
      - "5252:5252"
    environment:
      PLEX_URL: ${PLEX_URL:-http://plex:32400}
      PLEX_TOKEN: ${PLEX_TOKEN}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-http://qbittorrent:8080}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      DEBOUNCE_SECONDS: ${DEBOUNCE_SECONDS:-3}
      STOP_DELAY_SECONDS: ${STOP_DELAY_SECONDS:-30}
      PAUSE_BUFFER_DELAY_SECONDS: ${PAUSE_BUFFER_DELAY_SECONDS:-60}
      DYNAMIC_UPLOAD_ENABLED: ${DYNAMIC_UPLOAD_ENABLED:-false}
      MAX_UPLOAD_MIB: ${MAX_UPLOAD_MIB:-12}
      MIN_UPLOAD_MIB: ${MIN_UPLOAD_MIB:-1}
      BANDWIDTH_MULTIPLIER: ${BANDWIDTH_MULTIPLIER:-1}
      PLEX_TIMEOUT: ${PLEX_TIMEOUT:-10}
      QBITTORRENT_TIMEOUT: ${QBITTORRENT_TIMEOUT:-10}
      DRIFT_CHECK_SECONDS: ${DRIFT_CHECK_SECONDS:-60}
      PLEX_STALE_SECONDS: ${PLEX_STALE_SECONDS:-120}
      THEATER_URL: ${THEATER_URL:-}
      THEATER_API_KEY: ${THEATER_API_KEY:-}
      THEATER_BANDWIDTH_FACTOR: ${THEATER_BANDWIDTH_FACTOR:-1}
      THEATER_POLL_INTERVAL_SECONDS: ${THEATER_POLL_INTERVAL_SECONDS:-5}
      THEATER_TIMEOUT_SECONDS: ${THEATER_TIMEOUT_SECONDS:-3}
      THEATER_STALE_SECONDS: ${THEATER_STALE_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_PORT: 5252
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck comes from the image. Add a network only if you address Plex
    # and qBittorrent by container name rather than IP:
    #   networks: [plex-network]
    # Add a volume only if you want the rotated file log on disk:
    #   volumes: ["/absolute/host/path/logs:/app/logs"]
